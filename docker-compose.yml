services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: asset
      POSTGRES_PASSWORD: asset
      POSTGRES_DB: asset_register
    ports:
      - '5434:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U asset -d asset_register']
      interval: 5s
      timeout: 3s
      retries: 10

  # Lokalny zamiennik Cloudflare R2 (to samo API S3).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: asset
      MINIO_ROOT_PASSWORD: asset-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
